name: Build APK artifact

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build release APK
        run: sh ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Publish directly downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="coordinate-entry-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "Coordinate entry test build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated test APK containing manual latitude/longitude entry. Not a formal version release." \
            --prerelease
